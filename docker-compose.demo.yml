# ==============================================================================
# TRACEMIND DEMO DEPLOYMENT TOPOLOGY (M0–M15 TECHNICAL SHOWCASE)
# 
# Purpose: Zero-cost, isolated, reproducible technical demo profile for
#          GitHub Codespaces, local Docker, and interview walkthroughs.
#
# Port Exposure Security:
#   - PUBLIC PORT: 80 (Nginx Reverse Proxy & React Dashboard)
#   - INTERNAL ONLY: 5432 (Postgres), 9092 (Kafka), 8000 (API), 9090 (Prometheus), 3000 (Grafana)
# ==============================================================================

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tracemind-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind_demo_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind_demo_db}
    expose:
      - "5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemind_demo} -d ${POSTGRES_DB:-tracemind_demo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - tracemind-demo-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: tracemind-demo-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    expose:
      - "9092"
    volumes:
      - kafka_demo_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - tracemind-demo-net

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: tracemind-demo-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: demo
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracemind_demo}:${POSTGRES_PASSWORD:-tracemind_demo_secret_2026}@postgres:5432/${POSTGRES_DB:-tracemind_demo_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_HOST: 0.0.0.0
      API_PORT: 8000
      AI_PROVIDER: mock
      AI_API_KEY: ""
      AI_MODEL_NAME: "mock-react-analyst"
      TRACEMIND_SECRET_KEY: ${TRACEMIND_SECRET_KEY:-tracemind_demo_deterministic_secret_key_2026}
      REMEDIATION_ACTUATOR_TYPE: in_memory
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.4"
          memory: 384M
    security_opt:
      - no-new-privileges:true
    networks:
      - tracemind-demo-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: tracemind-demo-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tracemind_demo}:${POSTGRES_PASSWORD:-tracemind_demo_secret_2026}@postgres:5432/${POSTGRES_DB:-tracemind_demo_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: tracemind-demo-ingestor
      KAFKA_BATCH_SIZE: 500
      KAFKA_FLUSH_INTERVAL_MS: 50
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - tracemind-demo-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: tracemind-demo-frontend
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-80}:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - tracemind-demo-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tracemind-demo-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_demo_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tracemind-demo-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tracemind-demo-grafana
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=tracemind_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_demo_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - tracemind-demo-net

volumes:
  postgres_demo_data:
  kafka_demo_data:
  prometheus_demo_data:
  grafana_demo_data:

networks:
  tracemind-demo-net:
    driver: bridge
