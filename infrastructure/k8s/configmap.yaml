apiVersion: v1
kind: ConfigMap
metadata:
  name: tracemind-config
  namespace: tracemind
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  KAFKA_BOOTSTRAP_SERVERS: "tracemind-kafka:9092"
  KAFKA_TOPIC_TRACES: "tracemind.events.raw"
  KAFKA_CONSUMER_GROUP: "tracemind-k8s-ingestor"
  KAFKA_BATCH_SIZE: "1000"
  KAFKA_FLUSH_INTERVAL_MS: "50"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  DATABASE_POOL_TIMEOUT: "30.0"
  AI_PROVIDER: "openai"
  AI_MODEL_NAME: "gpt-4o-mini"
