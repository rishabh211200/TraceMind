apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracemind-ingress
  namespace: tracemind
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - tracemind.example.com
      secretName: tracemind-tls-secret
  rules:
    - host: tracemind.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: tracemind-api-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: tracemind-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracemind-frontend-service
                port:
                  number: 80
