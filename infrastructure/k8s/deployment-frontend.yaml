apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracemind-frontend
  namespace: tracemind
  labels:
    app.kubernetes.io/name: tracemind-frontend
    app.kubernetes.io/component: web-ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracemind-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracemind-frontend
        app.kubernetes.io/component: web-ui
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rishabh211200/tracemind-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tracemind-frontend-service
  namespace: tracemind
  labels:
    app.kubernetes.io/name: tracemind-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracemind-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
