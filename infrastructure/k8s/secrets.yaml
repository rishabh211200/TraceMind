# ==============================================================================
# TRACEMIND KUBERNETES SECRETS TEMPLATE (PLACEHOLDERS ONLY - NO REAL CREDENTIALS)
#
# In production, inject these secrets dynamically using:
#   1. External Secrets Operator (AWS Secrets Manager / GCP Secret Manager / Vault)
#   2. SealedSecrets (Bitnami)
#   3. kubectl create secret generic tracemind-secrets --from-literal=...
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tracemind-secrets
  namespace: tracemind
type: Opaque
stringData:
  # Replace with production PostgreSQL connection URL (e.g. Amazon Aurora / Cloud SQL)
  DATABASE_URL: "postgresql+asyncpg://tracemind_user:REPLACE_WITH_SECURE_PASSWORD@postgres-cluster.tracemind.svc.cluster.local:5432/tracemind_db"
  
  # Replace with OpenAI, Anthropic, or Gemini API key
  AI_API_KEY: "REPLACE_WITH_ACTUAL_AI_PROVIDER_API_KEY"
