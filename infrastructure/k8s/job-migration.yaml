apiVersion: batch/v1
kind: Job
metadata:
  name: tracemind-schema-migration
  namespace: tracemind
  labels:
    app.kubernetes.io/name: tracemind-migrator
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracemind-migrator
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrator
          image: ghcr.io/rishabh211200/tracemind-migrator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tracemind-config
            - secretRef:
                name: tracemind-secrets
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
