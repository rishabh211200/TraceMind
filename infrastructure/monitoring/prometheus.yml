global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "tracemind-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]
        labels:
          application: "tracemind"
          environment: "production"
